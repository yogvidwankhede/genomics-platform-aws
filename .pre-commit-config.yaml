# pre-commit install  ->  runs on every commit. `pre-commit run --all-files` to check everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pipeline/tests/(data|fixtures)/|\.nf\.test\.snap$
      - id: end-of-file-fixer
        exclude: ^pipeline/tests/(data|fixtures)/|\.nf\.test\.snap$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=3000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
        exclude: ^infra/modules/.*/tests/
