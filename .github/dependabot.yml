version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/platform"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /containers/nextflow-head
    schedule: { interval: weekly }
